<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>MarketCal · 财报与宏观日历</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0807;
      --panel: rgba(28,22,18,0.72);
      --hover: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.13);
      --text-1: #f2eee9;
      --text-2: #b0a69c;
      --text-3: #766c63;
      --accent: #f5a524;
      --grad: linear-gradient(120deg, #f59e0b 0%, #f97316 55%, #ef4444 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(245,158,11,0.14);
      --glow-2: rgba(239,68,68,0.08);
      --high: #ef4444;
      --medium: #f59e0b;
      --bmo: #38bdf8;
      --amc: #a78bfa;
      --watch: #f5a524;
      --kbd-bg: rgba(255,255,255,0.06);
      --logo-bg: #fff;
    }
    :root[data-theme="light"] {
      --bg: #fbf9f6;
      --panel: rgba(255,255,255,0.88);
      --hover: rgba(40,20,0,0.035);
      --line: rgba(40,20,0,0.08);
      --line-2: rgba(40,20,0,0.15);
      --text-1: #1d1712;
      --text-2: #5f554c;
      --text-3: #978c82;
      --accent: #c2410c;
      --grid-dot: rgba(40,20,0,0.06);
      --glow-1: rgba(245,158,11,0.09);
      --glow-2: rgba(239,68,68,0.05);
      --high: #dc2626;
      --medium: #d97706;
      --bmo: #0284c7;
      --amc: #7c3aed;
      --watch: #c2410c;
      --kbd-bg: rgba(40,20,0,0.05);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(600px 400px at 15% -5%, var(--glow-1), transparent 70%),
        radial-gradient(700px 500px at 95% 0%, var(--glow-2), transparent 70%),
        radial-gradient(circle, var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 20px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--grad); display: grid; place-items: center; font-size: 15px; box-shadow: 0 0 20px var(--glow-1); }
    .logo small { font-weight: 500; font-size: 12px; color: var(--text-3); letter-spacing: 0; }
    .search {
      flex: 1; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 36px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow-1); }
    .search svg { color: var(--text-3); flex: none; }
    .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text-1); font: inherit; font-size: 13.5px; }
    .search input::placeholder { color: var(--text-3); }
    kbd { font-family: inherit; font-size: 11px; color: var(--text-3); background: var(--kbd-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
    .top-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .updated { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.2); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
    .icon-btn { width: 34px; height: 34px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; display: grid; place-items: center; color: var(--text-2); flex: none; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn:disabled { cursor: default; opacity: .6; }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .layout { max-width: 1400px; margin: 0 auto; padding: 24px 24px 64px; display: grid; grid-template-columns: 200px minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
    .side { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; scrollbar-width: none; }
    .side::-webkit-scrollbar { display: none; }
    .side-title { font-size: 11.5px; color: var(--text-3); padding: 0 10px; margin: 4px 0 8px; letter-spacing: .04em; }
    .side-group + .side-group { margin-top: 22px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: none; background: none; cursor: pointer; text-align: left; color: var(--text-2); font-size: 13.5px; position: relative; }
    .nav-item:hover { background: var(--hover); color: var(--text-1); }
    .nav-item.active { background: var(--panel); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line); }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--grad); }
    .nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

    /* ── Main header ── */
    .main-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .main-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .main-head h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .main-head p { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
    .tabs { display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: none; background: none; cursor: pointer; font-size: 13px; color: var(--text-3); white-space: nowrap; }
    .tab:hover { color: var(--text-1); }
    .tab.active { background: var(--hover); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line-2); }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .muted { color: var(--text-3); }
    .warn { color: #f59e0b; }
    .empty { text-align: center; padding: 60px 0; color: var(--text-3); }
    .loading { padding: 80px 0; text-align: center; color: var(--text-3); }
    .note { font-size: 12px; color: var(--text-3); margin-top: 12px; }
    .section-title { font-size: 13px; color: var(--text-3); margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
    .section-title:first-child { margin-top: 0; }
    .section-title b { color: var(--text-1); font-size: 14.5px; }

    /* ── Badges ── */
    .imp { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
    .imp.High { background: var(--high); box-shadow: 0 0 0 3px color-mix(in srgb, var(--high) 25%, transparent); }
    .imp.Medium { background: var(--medium); }
    .tm { font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
    .tm.bmo { color: var(--bmo); } .tm.amc { color: var(--amc); } .tm.tbd { color: var(--text-3); }
    .tag { font-size: 10.5px; font-weight: 700; line-height: 16px; padding: 0 5px; border-radius: 4px; color: #fff; background: var(--watch); white-space: nowrap; }
    .kind { font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 5px; background: var(--hover); color: var(--text-2); white-space: nowrap; }

    /* ── Hero ── */
    .hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .count-card { padding: 18px 20px; position: relative; overflow: hidden; }
    .count-card::after { content: ''; position: absolute; inset: 0; background: var(--grad); opacity: .07; pointer-events: none; }
    .count-card .lbl { font-size: 12px; color: var(--text-3); }
    .count-card .ttl { font-size: 15.5px; font-weight: 700; margin: 4px 0 8px; overflow-wrap: anywhere; }
    .count-card .big { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .count-card .big span { font-size: 14px; font-weight: 600; color: var(--text-2); margin-left: 2px; }
    .count-card .sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    /* ── Week grid ── */
    .week { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .day { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .day.today { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
    .day-head { display: flex; align-items: baseline; gap: 8px; }
    .day-head b { font-size: 15px; }
    .day-head small { font-size: 12px; color: var(--text-3); }
    .day-head .kit-morelink { margin-left: auto; font-size: 11.5px; }
    .day-head .pill + .kit-morelink { margin-left: 8px; }
    .day-head .pill { margin-left: auto; font-size: 11px; color: var(--accent); font-weight: 700; }
    .ev { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; min-width: 0; }
    .ev .t { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; flex: none; }
    .ev .n { min-width: 0; overflow-wrap: anywhere; }
    .er-line { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; }
    .sym { font-weight: 700; font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--hover); border: 1px solid var(--line); white-space: nowrap; }
    .sym.w { border-color: color-mix(in srgb, var(--watch) 60%, transparent); color: var(--watch); }
    .more { font-size: 11.5px; color: var(--text-3); }
    .day-empty { font-size: 12px; color: var(--text-3); }

    /* ── Earnings table ── */
    .er-day + .er-day { margin-top: 14px; }
    .er-day-head { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 8px; }
    .er-day-head b { font-size: 15px; }
    .er-day-head small { font-size: 12px; color: var(--text-3); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--text-3); padding: 6px 14px; border-bottom: 1px solid var(--line); }
    td { padding: 8px 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--hover); }
    tr.w td { background: color-mix(in srgb, var(--watch) 8%, transparent); }
    td.nm { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    .num { text-align: right; }
    .show-all { display: block; margin: 0 16px 12px; padding: 6px; width: calc(100% - 32px); border-radius: 8px; border: 1px dashed var(--line-2); background: none; color: var(--text-3); cursor: pointer; font-size: 12.5px; }
    .show-all:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Macro list ── */
    .mc { display: flex; gap: 14px; align-items: center; padding: 12px 16px; }
    .mc + .mc { border-top: 1px solid var(--line); }
    .mc.past { opacity: .5; }
    .mc .when { width: 110px; flex: none; }
    .mc .when b { display: block; font-size: 13.5px; }
    .mc .when small { font-size: 11.5px; color: var(--text-3); }
    .mc .body { flex: 1; min-width: 0; }
    .mc .body b { font-size: 14px; overflow-wrap: anywhere; }
    .mc .body small { display: block; font-size: 11.5px; color: var(--text-3); overflow-wrap: anywhere; }
    .mc .vals { font-size: 12px; color: var(--text-2); white-space: nowrap; text-align: right; }
    .mc .cd { width: 64px; flex: none; text-align: right; font-size: 12px; color: var(--accent); font-weight: 600; }

    /* ── Right widgets ── */
    .widget { padding: 14px 16px 12px; }
    .widget + .widget { margin-top: 16px; }
    .widget-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .widget-head b { font-size: 14px; }
    .widget-head small { font-size: 11.5px; color: var(--text-3); }
    .w-row { display: flex; gap: 8px; padding: 5px 0; font-size: 13px; align-items: center; }
    .w-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .w-row small { color: var(--text-3); font-size: 11px; white-space: nowrap; }
    .status-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; color: var(--text-2); }
    .status-row .t { margin-left: auto; color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
    .ok { color: #22c55e; } .bad { color: #ef4444; }

    /* ── Responsive ── */
    @media (max-width: 1180px) {
      .layout { grid-template-columns: 180px minmax(0, 1fr); }
      /* 右栏不再隐藏：挪到正文下面，三个挂件并排 */
      .right { grid-column: 2; position: static; max-height: none; overflow: visible; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start; }
      .right .widget + .widget { margin-top: 0; }
    }
    @media (max-width: 760px) {
      .topbar-inner { padding: 0 14px; gap: 10px; }
      .logo small, .updated span, kbd { display: none; }
      .search { min-width: 0; }
      .layout { grid-template-columns: minmax(0, 1fr); padding: 14px 14px 48px; gap: 14px; }
      .side { position: static; max-height: none; overflow: visible; min-width: 0; }
      .side-group + .side-group { margin-top: 10px; }
      .side-title { display: none; }
      .nav-list { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
      .nav-list::-webkit-scrollbar { display: none; }
      .nav-item { width: auto; flex: none; white-space: nowrap; border: 1px solid var(--line); padding: 5px 10px; }
      .nav-item.active::before { display: none; }
      .nav-item .count { display: none; }
      .tabs { width: 100%; overflow-x: auto; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { padding: 6px 10px; }
      .week { grid-template-columns: minmax(0, 1fr); }
      .mc { flex-wrap: wrap; gap: 6px 12px; }
      .mc .when { width: auto; }
      .mc .body { flex-basis: 100%; order: 3; }
      .mc .vals { order: 4; text-align: left; }
      .mc .cd { margin-left: auto; }
      .right { grid-column: 1; grid-template-columns: minmax(0, 1fr); }
      /* 财报表格：手机只留 代码（下附公司名）/ 时间 / 市值 / EPS 预期 */
      .c-opt { display: none; }
      .nm-m { display: block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
      th, td { padding: 7px 10px; }
    }
    /* ── 详情抽屉 + 列表页（通用组件 kit：电脑右侧滑出，手机底部升起；地址 #/item/类型/id、#/list/key） ── */
    :root { --kit-bg: var(--bg, #0b0a10); --kit-panel: var(--panel, var(--card, rgba(255,255,255,.04))); --kit-line: var(--line, var(--sep, rgba(255,255,255,.08)));
      --kit-line2: var(--line-2, rgba(255,255,255,.14)); --kit-t1: var(--text-1, #f1eff7); --kit-t2: var(--text-2, #a39fb3); --kit-t3: var(--text-3, #6b677a);
      --kit-accent: var(--accent, #a3e635); --kit-hover: var(--hover, rgba(255,255,255,.05)); }
    .kit-mask { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.38); display: none; }
    .kit-mask.open { display: block; }
    .kit-sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: clamp(440px, 42vw, 620px); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; overflow: hidden; color: var(--kit-t1); border-radius: 18px;
      background: linear-gradient(var(--kit-panel), var(--kit-panel)), var(--kit-bg); box-shadow: 0 0 0 1px var(--kit-line2), 0 24px 60px rgba(0,0,0,.45);
      animation: kit-in .24s ease-out; }
    @keyframes kit-in { from { transform: translateX(40px); opacity: 0; } }
    .kit-sheet.kit-small { bottom: auto; }
    .kit-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
      background: rgba(0,0,0,.5); color: #fff; font-size: 15px; display: grid; place-items: center; }
    .kit-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .kit-cover { aspect-ratio: 16/9; background: var(--kit-hover) center / cover no-repeat; position: relative; }
    .kit-cover.tall { aspect-ratio: auto; height: 280px; background-size: contain; background-color: #000; }
    .kit-cover.ph { display: grid; place-items: center; font-size: 56px; aspect-ratio: 16/6; }
    .kit-head { padding: 18px 20px 4px; display: flex; gap: 14px; align-items: flex-start; }
    .kit-head .kit-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 14px; background: var(--kit-hover) center / cover no-repeat;
      display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .kit-head .kit-t { flex: 1; min-width: 0; padding-right: 30px; }
    .kit-cover + .kit-head .kit-t { padding-right: 0; }
    .kit-head h2 { font-size: 19px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; }
    .kit-sub { color: var(--kit-t2); font-size: 13px; margin-top: 4px; }
    .kit-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .kit-tags span { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--kit-hover); color: var(--kit-t2); }
    .kit-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .kit-big b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-body { padding: 4px 20px 20px; }
    .kit-sec { padding-top: 16px; }
    .kit-sec + .kit-sec { margin-top: 6px; border-top: 1px solid var(--kit-line); }
    .kit-sec h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .kit-sec h4 small { font-size: 12px; color: var(--kit-t3); font-weight: 500; }
    .kit-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .kit-kv div { background: var(--kit-hover); border-radius: 10px; padding: 8px 11px; min-width: 0; }
    .kit-kv small { display: block; font-size: 11px; color: var(--kit-t3); }
    .kit-kv b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .kit-p { font-size: 13.5px; line-height: 1.75; color: var(--kit-t2); white-space: pre-line; }
    .kit-rows { display: flex; flex-direction: column; }
    .kit-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--kit-line); font-size: 13px; text-decoration: none; color: inherit; }
    .kit-row:first-child { border-top: 0; }
    .kit-row[data-kit-go], a.kit-row { cursor: pointer; }
    .kit-row[data-kit-go]:hover .kit-rt, a.kit-row:hover .kit-rt { color: var(--kit-accent); }
    .kit-row .kit-rt { flex: 1; min-width: 0; line-height: 1.45; }
    .kit-row .kit-rm { color: var(--kit-t3); font-size: 12px; white-space: nowrap; }
    .kit-row img, .kit-row .kit-ri { width: 54px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--kit-hover); }
    .kit-acts { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--kit-line); }
    .kit-acts a, .kit-acts button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 12px; border-radius: 11px;
      font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid var(--kit-line2); color: var(--kit-t1); background: transparent; }
    .kit-acts .pri { background: var(--kit-accent); border-color: var(--kit-accent); color: #111; }
    .kit-acts a:hover, .kit-acts button:hover { filter: brightness(1.08); }
    /* 列表页 */
    .kit-lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .kit-back { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1);
      font-size: 20px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
    .kit-back:hover { background: var(--kit-hover); }
    .kit-lhead h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-lhead small { color: var(--kit-t3); font-size: 12.5px; margin-left: 2px; }
    .kit-lbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .kit-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .kit-chips a, .kit-chips button { padding: 5px 12px; border-radius: 8px; background: var(--kit-hover); color: var(--kit-t2); font: inherit; font-size: 13px;
      font-weight: 600; white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; }
    .kit-chips .on { background: var(--kit-t1); color: var(--kit-bg); }
    .kit-chips small { opacity: .6; margin-left: 4px; font-weight: 500; }
    .kit-sel { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1); font: inherit; font-size: 12.5px; font-weight: 600; }
    .kit-sel option { background: var(--kit-bg); }
    .kit-more { display: block; margin: 16px auto 0; padding: 9px 22px; border-radius: 10px; border: 1px solid var(--kit-line2); background: transparent;
      color: var(--kit-t1); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kit-more:hover { background: var(--kit-hover); }
    .kit-morelink { font-size: 13px; font-weight: 600; color: var(--kit-t2); text-decoration: none; white-space: nowrap; cursor: pointer; }
    .kit-morelink:hover { color: var(--kit-t1); }
    [data-kit-item] { cursor: pointer; }
    @media (max-width: 760px) {
      .kit-sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; height: 86vh; border-radius: 18px 18px 0 0; animation: kit-up .26s ease-out; }
      @keyframes kit-up { from { transform: translateY(30%); opacity: .5; } }
      .kit-sheet.kit-small { height: auto; }
      .kit-head { padding: 16px 16px 4px; } .kit-body { padding: 4px 16px 18px; } .kit-acts { padding: 10px 16px 16px; }
      .kit-cover.tall { height: 220px; }
      .kit-head .kit-thumb { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; }
      .kit-head h2 { font-size: 17.5px; }
      .kit-big b { font-size: 24px; }
      .kit-lhead h2 { font-size: 19px; }
    }
    /* 可点开详情的元素 */
    .sym[data-kit-item]:hover { border-color: var(--accent); color: var(--accent); }
    .ev[data-kit-item], .w-row[data-kit-item], .mc[data-kit-item] { border-radius: 6px; }
    .ev[data-kit-item]:hover .n, .w-row[data-kit-item]:hover .nm, .mc[data-kit-item]:hover .body b { color: var(--accent); }
    .count-card[data-kit-item]:hover { border-color: var(--line-2); }
    .nm-m { display: none; }
    .more.show-more { text-decoration: none; }
    .more.show-more:hover, .er-more:hover { color: var(--accent); }
    .er-more { display: block; margin: 0 16px 12px; padding: 6px; text-align: center; border-radius: 8px; border: 1px dashed var(--line-2); color: var(--text-3); font-size: 12.5px; }
    .section-title .kit-morelink { margin-left: auto; }
    /* 公司 logo：首字母块打底，logo 加载成功后盖在上面 */
    .co-logo { position: relative; width: 100%; height: 100%; display: grid; place-items: center; font-weight: 800; font-size: 22px; color: #fff; background: var(--grad); }
    .co-logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 8px; background: var(--logo-bg); }
    .kit-row .co-logo { width: 28px; height: 28px; border-radius: 7px; font-size: 12px; flex-shrink: 0; overflow: hidden; }
    .kit-row .co-logo img { padding: 3px; }
    /* 列表页：日期切换 + 市值筛选 */
    .lp-days { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .lp-days a { padding: 4px 10px; border-radius: 8px; font-size: 12.5px; color: var(--text-2); border: 1px solid var(--line); white-space: nowrap; }
    .lp-days a.on { color: var(--text-1); border-color: var(--accent); }
    .lp-days a small { color: var(--text-3); margin-left: 4px; }
  </style>

<script>
// ── kit：详情抽屉 + 列表页路由（各站通用，内联在页面里）──
// 用法：
//   KIT.item('news', id => ({ title, sub, cover, thumb, tags:[], big, body:'<div class="kit-sec">…</div>', acts:[{text, href, pri}] }))
//   KIT.list('news', (param, query) => { … 把列表页 HTML 写进容器 … })
//   条目元素加 data-kit-item="news/<id>" 即可点击打开详情；「查看更多」写成 <a href="#/list/news">
//   站点首页渲染函数里先调用 KIT.route() —— 返回 true 表示当前是列表页（已渲染），首页不用再渲染
const KIT = (() => {
  const items = {}, lists = {};
  let mask, homeY = 0, fromHome = 0, lastHash = location.hash, onHome = null, listBox = null;
  const kesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const parse = h => {
    const m = (h === undefined ? location.hash : h).match(/^#\/(item|list)\/([^?]+?)(?:\?(.*))?$/);
    if (!m) return null;
    const [type, ...rest] = m[2].split('/');
    return { kind: m[1], type: decodeURIComponent(type), id: rest.map(decodeURIComponent).join('/'), q: new URLSearchParams(m[3] || '') };
  };
  function ensure() {
    if (mask) return;
    mask = document.createElement('div');
    mask.className = 'kit-mask';
    mask.innerHTML = '<div class="kit-sheet" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-kit-close]')) close(); });
  }
  function render(d) {
    ensure();
    const cover = d.cover ? `<div class="kit-cover ${d.coverTall ? 'tall' : ''}" style="background-image:url('${kesc(d.cover).replace(/'/g, '%27')}')"></div>`
      : d.coverIcon ? `<div class="kit-cover ph" style="background:${d.coverBg || 'var(--kit-hover)'}">${d.coverIcon}</div>` : '';
    const thumb = !d.cover && !d.coverIcon && (d.thumb || d.thumbIcon)
      ? `<div class="kit-thumb" style="${d.thumb ? `background-image:url('${kesc(d.thumb).replace(/'/g, '%27')}')` : ''}${d.thumbBg ? `;background-color:${d.thumbBg}` : ''}">${d.thumb ? '' : d.thumbIcon}</div>` : '';
    const acts = (d.acts || []).filter(a => a && (a.href || a.onclick));
    mask.firstElementChild.innerHTML = `<button class="kit-x" data-kit-close aria-label="关闭">✕</button>
      <div class="kit-scroll">${cover}
        <div class="kit-head">${thumb}<div class="kit-t"><h2>${kesc(d.title)}</h2>${d.sub ? `<div class="kit-sub">${d.sub}</div>` : ''}
          ${(d.tags || []).filter(Boolean).length ? `<div class="kit-tags">${d.tags.filter(Boolean).join('')}</div>` : ''}${d.big ? `<div class="kit-big">${d.big}</div>` : ''}</div></div>
        <div class="kit-body">${d.body || ''}</div></div>
      ${acts.length ? `<div class="kit-acts">${acts.map((a, i) => a.href
        ? `<a class="${a.pri || (i === 0 && acts.length < 3) ? 'pri' : ''}" href="${kesc(a.href)}" ${a.self ? '' : 'target="_blank" rel="noopener"'}>${a.text}</a>`
        : `<button class="${a.pri ? 'pri' : ''}" data-kit-act="${i}">${a.text}</button>`).join('')}</div>` : ''}`;
    acts.forEach((a, i) => { if (!a.href) { const b = mask.querySelector(`[data-kit-act="${i}"]`); if (b) b.onclick = a.onclick; } });
    mask.firstElementChild.classList.toggle('kit-small', !!d.small);       // 内容很少的提示：抽屉按内容高度
    mask.querySelector('.kit-scroll').scrollTop = 0;
    mask.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  // 打开详情：写进地址（可分享；浏览器返回 = 关闭）
  function open(key) {
    const target = '#/item/' + key;
    if (location.hash === target) return show(parse(target));
    ensure();
    if (parse()?.kind === 'item') history.replaceState(history.state, '', target);
    else { mask.dataset.base = location.hash; history.pushState({ kit: 1 }, '', target); }
    lastHash = target;
    show(parse(target));
  }
  function show(r) {
    const fn = items[r.type];
    const d = fn && fn(r.id, r.q);
    // 找不到这一条（已下榜 / 过期 / 链接是旧数据里的）：给个提示，而不是什么都不弹
    render(d || { small: true, title: '这条内容已不在当前数据里', sub: '数据每天自动更新，它可能已经下榜、过期或被合并到别的条目', thumbIcon: '🕓',
      body: KIT.p('可以回到首页看最新的内容，或用页面顶部的搜索找一找。'), acts: [{ text: '回到首页', href: '#', self: true, pri: true }] });
    return !!d;
  }
  function close(silent) {
    if (!mask || !mask.classList.contains('open')) return;
    mask.classList.remove('open');
    document.body.style.overflow = '';
    if (!silent && parse()?.kind === 'item') {
      if (history.state && history.state.kit) history.back();          // 从页面里点开的：退回去
      else { history.replaceState(null, '', mask.dataset.base || location.pathname + location.search); lastHash = location.hash; }   // 直接打开的分享链接
    }
  }
  // 当前地址是列表页时渲染列表页并返回 true；首页时返回 false
  function route(box) {
    if (box) listBox = box;
    const r = parse();
    if (r && r.kind === 'list' && lists[r.type]) { lists[r.type](r.id, r.q, listBox); return true; }
    return false;
  }
  // 列表页的公共外壳：返回按钮 + 标题 + 子分类 + 排序
  function shell({ title, note, chips, sort, sortVal, body, more }) {
    return `<div class="kit-lhead"><button class="kit-back" data-kit-back title="返回">‹</button><h2>${kesc(title)}</h2>${note ? `<small>${note}</small>` : ''}</div>
      ${chips || sort ? `<div class="kit-lbar"><div class="kit-chips">${(chips || []).map(c => `<a class="${c.on ? 'on' : ''}" href="${kesc(c.href)}">${kesc(c.text)}${c.count != null ? `<small>${c.count}</small>` : ''}</a>`).join('')}</div>
        ${sort ? `<select class="kit-sel" data-kit-sort>${sort.map(([v, n]) => `<option value="${kesc(v)}" ${v === sortVal ? 'selected' : ''}>${kesc(n)}</option>`).join('')}</select>` : ''}</div>` : ''}
      ${body}${more ? `<button class="kit-more" data-kit-more>${more}</button>` : ''}`;
  }
  function init(home) {
    onHome = home;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-kit-item],[data-kit-go],[data-kit-back]');
      if (!t) return;
      const inner = e.target.closest('a[href],button,input,select,label,summary');   // 卡片里的其它按钮 / 链接（关注、复制…）优先
      if (inner && inner !== t && t.contains(inner)) return;
      e.preventDefault();
      if (t.dataset.kitBack !== undefined) { fromHome && history.length > fromHome ? history.go(-fromHome) : (location.hash = ''); return; }
      open(t.dataset.kitItem || t.dataset.kitGo);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    window.addEventListener('hashchange', () => {
      const r = parse();
      let was = parse(lastHash), steps = 1;
      if (was && was.kind === 'item') {                                 // 从详情离开
        const base = mask && mask.dataset.base !== undefined ? mask.dataset.base : '';
        if (location.hash === base) { lastHash = location.hash; close(true); return; }   // 只是关掉详情，底下页面不动
        was = parse(base); steps = 2;                                   // 在详情里点了别的列表：按详情底下那页算，返回要退两步
      }
      lastHash = location.hash;
      if (r && r.kind === 'item') { show(r); return; }
      close(true);
      const wasHome = !was;
      if (r && r.kind === 'list') {
        if (wasHome) { homeY = scrollY; fromHome = steps; }
        onHome && onHome();
        if (wasHome || was.type !== r.type) scrollTo(0, 0);
      } else {
        onHome && onHome();
        if (fromHome) { scrollTo(0, homeY); fromHome = 0; }
      }
    });
    // 直接打开带 #/item/ 的链接（比如大屏跳过来）：页面数据读完后由站点调用 KIT.boot()
  }
  function boot() { const r = parse(); if (r && r.kind === 'item') show(r); }
  return { item: (t, fn) => (items[t] = fn), list: (t, fn) => (lists[t] = fn), open, close, route, shell, init, boot, parse, esc: kesc,
    // 小工具：详情里的键值格、段落、关联列表
    kv: rows => { const r = rows.filter(x => x && x[1] != null && x[1] !== ''); return r.length ? `<div class="kit-kv">${r.map(([k, v]) => `<div><small>${kesc(k)}</small><b title="${kesc(v)}">${kesc(v)}</b></div>`).join('')}</div>` : ''; },
    sec: (title, html, note) => html ? `<div class="kit-sec"><h4>${title}${note ? `<small>${note}</small>` : ''}</h4>${html}</div>` : '',
    p: t => t ? `<p class="kit-p">${kesc(t)}</p>` : '',
  };
})();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem('mc.' + k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('mc.' + k, JSON.stringify(v)); } catch {} },
};

const DAY = 86400000;
const VIEWS = ['week', 'earnings', 'macro'];
const CAPS = [
  { id: 'watch', name: '只看关注', test: r => !!r.watch },
  { id: 1e11,    name: '≥ 1000 亿美元', test: r => r.watch || r.mcap >= 1e11 },
  { id: 1e10,    name: '≥ 100 亿美元', test: r => r.watch || r.mcap >= 1e10 },
  { id: 1e9,     name: '≥ 10 亿美元', test: r => true },
];
const COUNTRIES = [{ id: 'USD', name: '美国' }, { id: 'all', name: '全球' }];
const COUNTRY_ZH = { USD: '美国', CNY: '中国', EUR: '欧元区', GBP: '英国', JPY: '日本', CAD: '加拿大', AUD: '澳大利亚', NZD: '新西兰', CHF: '瑞士', All: '全球' };
const KIND_NAME = { fomc: '美联储', bea: 'BEA', week: '周历' };
const TIME_NAME = { bmo: '盘前', amc: '盘后', tbd: '时间未定' };
const WEEKDAY = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const DAY_TOP = 12;     // 本周概览每天最多列出的财报数
const ER_TOP = 15;      // 财报日历每天先列出的家数，其余进当天列表页

const state = {
  data: null,
  view: VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get('view', 'week'),   // #/item/、#/list/ 由 kit 处理，不会命中 VIEWS
  cap: store.get('cap', 1e10),
  country: store.get('country', 'USD'),
  q: '',
  showPast: false,
};

// ── 主题 ──
const applyTheme = t => document.documentElement.dataset.theme = t;
applyTheme(store.get('theme', 'dark'));
$('#theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set('theme', t);
};

// ── 日期工具：财报和宏观的 date 都是美东日期（YYYY-MM-DD），time 是带时区的 ISO ──
const ymd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const addDays = (s, n) => new Date(ymd(s).getTime() + n * DAY).toISOString().slice(0, 10);
const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
const wd = s => WEEKDAY[ymd(s).getUTCDay()];
const dayDiff = s => Math.round((ymd(s) - ymd(state.data.today_et)) / DAY);
const bj = iso => {
  const d = new Date(iso);
  const p = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d);
  const g = t => (p.find(x => x.type === t) || {}).value;
  return { date: `${g('month')}/${g('day')}`, time: `${g('hour')}:${g('minute')}` };
};

function countdown(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return { n: '已发布', u: '' };
  const h = ms / 3600000;
  if (h < 1) return { n: Math.max(1, Math.round(ms / 60000)), u: '分钟' };
  if (h < 48) return { n: Math.round(h), u: '小时' };
  return { n: Math.floor(h / 24), u: '天' };
}
function relDay(s) {
  const n = dayDiff(s);
  if (n === 0) return '今天';
  if (n === 1) return '明天';
  if (n === -1) return '昨天';
  return n > 0 ? `${n} 天后` : `${-n} 天前`;
}
function fmtCap(v) {
  if (!v) return '—';
  if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';
  if (v >= 1e9) return '$' + (v / 1e9).toFixed(1) + 'B';
  return '$' + (v / 1e6).toFixed(0) + 'M';
}

function matchQ(...texts) {
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return texts.some(t => (t || '').toLowerCase().includes(q));
}
const capTest = () => (CAPS.find(c => c.id === state.cap) || CAPS[2]).test;
const earnFiltered = () => state.data.earnings.filter(r => capTest()(r) && matchQ(r.symbol, r.name, r.watch));
const macroFiltered = () => state.data.macro.filter(e => (state.country === 'all' || e.country === state.country) && matchQ(e.title, e.title_en, COUNTRY_ZH[e.country]));
const symTag = r => `<span class="sym ${r.watch ? 'w' : ''}" title="${esc(r.name)}" data-kit-item="co/${encodeURIComponent(r.symbol)}">${esc(r.symbol)}</span>`;
const tmTag = t => `<span class="tm ${t}">${TIME_NAME[t] || t}</span>`;

// ── 左侧导航 ──
function renderNav() {
  const all = state.data.earnings.filter(r => dayDiff(r.date) >= 0);
  $('#caps').innerHTML = CAPS.map(c => `
    <button class="nav-item ${state.cap === c.id ? 'active' : ''}" data-cap="${c.id}">${c.name}
      <span class="count">${all.filter(c.test).length}</span></button>`).join('');
  const future = state.data.macro.filter(e => dayDiff(e.date) >= 0);
  $('#countries').innerHTML = COUNTRIES.map(c => `
    <button class="nav-item ${state.country === c.id ? 'active' : ''}" data-country="${c.id}">${c.name}
      <span class="count">${future.filter(e => c.id === 'all' || e.country === c.id).length}</span></button>`).join('');
}

// ── 视图：本周概览 ──
function nextEvent(list) { return list.find(e => new Date(e.time) > Date.now()); }

function renderWeek() {
  const today = state.data.today_et;
  const macro = macroFiltered();
  const earn = earnFiltered();
  const nextHigh = nextEvent(macro.filter(e => e.impact === 'High'));
  const nextFomc = nextEvent(state.data.macro.filter(e => e.kind === 'fomc'));
  const nextWatch = earn.find(r => r.watch && dayDiff(r.date) >= 0);
  const card = (lbl, ttl, cd, sub, key) => `<div class="card count-card" data-kit-item="${key}"><div class="lbl">${lbl}</div><div class="ttl">${ttl}</div>
      <div class="big">${cd.n}<span>${cd.u}</span></div><div class="sub">${sub}</div></div>`;
  const hero = [
    nextHigh && card('下一个高影响事件', esc(nextHigh.title), countdown(nextHigh.time), `北京时间 ${bj(nextHigh.time).date} ${bj(nextHigh.time).time} · ${esc(COUNTRY_ZH[nextHigh.country])}`, 'ev/' + nextHigh.id),
    nextFomc && nextFomc !== nextHigh && card('下次 FOMC 利率决议', esc(nextFomc.title), countdown(nextFomc.time), `北京时间 ${bj(nextFomc.time).date} ${bj(nextFomc.time).time}`, 'ev/' + nextFomc.id),
    nextWatch && card('下一家关注公司财报', `${esc(nextWatch.symbol)} · ${esc(nextWatch.name)}`,
      { n: Math.max(dayDiff(nextWatch.date), 0) || '今天', u: dayDiff(nextWatch.date) > 0 ? '天' : '' },
      `美东 ${md(nextWatch.date)} ${wd(nextWatch.date)} · ${TIME_NAME[nextWatch.time]}`, 'co/' + encodeURIComponent(nextWatch.symbol)),
  ].filter(Boolean).join('');

  const days = Array.from({ length: 7 }, (_, i) => addDays(today, i)).filter(d => ![0, 6].includes(ymd(d).getUTCDay()) || macro.some(e => e.date === d));
  const grid = days.map(d => {
    const evs = macro.filter(e => e.date === d);
    const ers = earn.filter(r => r.date === d);
    const line = t => {
      const rows = ers.filter(r => r.time === t || (t === 'tbd' && !['bmo', 'amc'].includes(r.time)));
      if (!rows.length) return '';
      const shown = rows.slice(0, DAY_TOP);   // 「+N」跳到当天的列表页
      return `<div class="er-line">${tmTag(t)}${shown.map(symTag).join('')}${rows.length > shown.length ? `<a class="more show-more" href="#/list/day/${d}?time=${t}">+${rows.length - shown.length}</a>` : ''}</div>`;
    };
    return `<div class="card day ${d === today ? 'today' : ''}">
      <div class="day-head"><b>${md(d)}</b><small>${wd(d)}</small>${d === today ? '<span class="pill">今天</span>' : ''}${ers.length ? `<a class="kit-morelink" href="#/list/day/${d}">${ers.length} 家 →</a>` : ''}</div>
      ${evs.map(e => `<div class="ev" data-kit-item="ev/${e.id}"><i class="imp ${e.impact}"></i><span class="t">${bj(e.time).time}</span><span class="n">${esc(e.title)}</span></div>`).join('')}
      ${line('bmo')}${line('amc')}${line('tbd')}
      ${!evs.length && !ers.length ? '<div class="day-empty">没有符合条件的事件</div>' : ''}
    </div>`;
  }).join('');
  return `${hero ? `<div class="hero">${hero}</div>` : ''}
    <div class="week">${grid}</div>
    <p class="note">日期按美东时间分组；宏观事件时间为北京时间。盘前财报约在北京时间当晚开盘前发布，盘后财报约在次日清晨发布。</p>`;
}

// ── 视图：财报日历 ──
function renderEarnings() {
  const list = earnFiltered().filter(r => state.showPast || dayDiff(r.date) >= 0);
  if (!list.length) return '<div class="empty">没有符合条件的财报</div>';
  const days = {};
  list.forEach(r => (days[r.date] ||= []).push(r));
  const pastN = earnFiltered().filter(r => dayDiff(r.date) < 0).length;
  return `${pastN ? `<button class="show-all" style="margin:0 0 14px;width:100%" data-past="1">${state.showPast ? '隐藏已过去的财报' : `显示已过去的 ${pastN} 条财报`}</button>` : ''}` +
    Object.entries(days).map(([d, rows]) => {
      rows.sort((a, b) => (!!b.watch - !!a.watch) || (b.mcap || 0) - (a.mcap || 0));
      const shown = rows.slice(0, ER_TOP);
      return `<section class="card er-day">
        <div class="er-day-head"><b>${md(d)} ${wd(d)}</b><small>${relDay(d)} · ${rows.length} 家</small><a class="kit-morelink" href="#/list/day/${d}" style="margin-left:auto">全部 →</a></div>
        <div class="table-wrap"><table>
          ${erTable(shown)}</table></div>
        ${rows.length > shown.length ? `<a class="er-more" href="#/list/day/${d}">查看当天全部 ${rows.length} 家 →</a>` : ''}
      </section>`;
    }).join('');
}

// ── 视图：宏观日历 ──
function renderMacro() {
  const list = macroFiltered().filter(e => state.showPast || dayDiff(e.date) >= -1);
  if (!list.length) return '<div class="empty">没有符合条件的事件</div>';
  const months = {};
  list.forEach(e => (months[e.date.slice(0, 7)] ||= []).push(e));
  const pastN = macroFiltered().filter(e => dayDiff(e.date) < -1).length;
  return `${pastN ? `<button class="show-all" style="margin:0 0 14px;width:100%" data-past="1">${state.showPast ? '隐藏较早的事件' : `显示较早的 ${pastN} 个事件`}</button>` : ''}` +
    Object.entries(months).map(([m, evs]) => `
    <div class="section-title"><b>${m.slice(0, 4)} 年 ${+m.slice(5)} 月</b>${evs.length} 个事件</div>
    <div class="card">${evs.map(e => {
      const t = bj(e.time), cd = countdown(e.time), past = new Date(e.time) < Date.now();
      const vals = [e.forecast && `预期 ${esc(e.forecast)}`, e.previous && `前值 ${esc(e.previous)}`].filter(Boolean).join(' · ');
      return `<div class="mc ${past ? 'past' : ''}" data-kit-item="ev/${e.id}">
        <div class="when"><b>${md(e.date)} ${wd(e.date)}</b><small>北京 ${t.date} ${t.time}</small></div>
        <i class="imp ${e.impact}" title="${e.impact === 'High' ? '高影响' : '中影响'}"></i>
        <div class="body"><b>${esc(e.title)}</b><small>${esc(COUNTRY_ZH[e.country] || e.country)} · <span class="kind">${KIND_NAME[e.kind]}</span> ${e.title !== e.title_en ? esc(e.title_en) : ''}</small></div>
        ${vals ? `<div class="vals">${vals}</div>` : ''}
        <div class="cd">${past ? '<span class="muted">已发布</span>' : `${cd.n} ${cd.u}`}</div>
      </div>`;
    }).join('')}</div>`).join('') +
    `<p class="note">FOMC 与 BEA 为官方全年日程；CPI、非农等其他指标来自 ForexFactory 周历，只在当周出现，之后会保留在这里。</p>`;
}

// ── 数据整理：宏观事件补稳定 id（日期 + 标题哈希），供详情地址 #/item/ev/<id> 使用 ──
function hashStr(s) { let h = 5381; for (const c of s) h = (h * 33 + c.charCodeAt(0)) >>> 0; return h.toString(36); }
function prepare(d) {
  d.macro.forEach(e => e.id = `${e.date}-${hashStr(e.kind + e.country + e.title_en)}`);
  return d;
}
const byCap = (a, b) => (!!b.watch - !!a.watch) || (b.mcap || 0) - (a.mcap || 0);
const epsNum = s => { if (!s) return null; const v = parseFloat(String(s).replace(/[^\d.]/g, '')); return isNaN(v) ? null : /^\(|^-/.test(s) ? -v : v; };
const LOGO = sym => `https://financialmodelingprep.com/image-stock/${encodeURIComponent(sym)}.png`;
// 公司 logo：首字母块打底，图片加载失败就移除，露出首字母
const logo = r => `<span class="co-logo">${esc((r.symbol || '?')[0])}<img src="${LOGO(r.symbol)}" alt="" loading="lazy" onerror="this.remove()"></span>`;

// 财报表格（财报日历与当天列表页共用）；手机端隐藏 .c-opt 列，公司名挪到代码下面
function erTable(rows) {
  return `<thead><tr><th>代码</th><th class="c-opt">公司</th><th>时间</th><th class="num">市值</th><th class="num">EPS 预期</th><th class="num c-opt">去年同期 EPS</th><th class="num c-opt">分析师数</th><th class="c-opt">财季</th></tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.watch ? 'w' : ''}" data-kit-item="co/${encodeURIComponent(r.symbol)}">
      <td>${symTag(r)} ${r.watch ? `<span class="tag">${esc(r.watch)}</span>` : ''}<small class="nm-m">${esc(r.name)}</small></td>
      <td class="nm c-opt" title="${esc(r.name)}">${esc(r.name)}</td>
      <td>${tmTag(r.time)}</td>
      <td class="num">${fmtCap(r.mcap)}</td>
      <td class="num">${esc(r.eps_fc || '—')}</td>
      <td class="num c-opt">${esc(r.eps_ly || '—')}</td>
      <td class="num c-opt">${esc(r.ests || '—')}</td>
      <td class="muted c-opt">${esc(r.fq)}</td>
    </tr>`).join('')}</tbody>`;
}

// ── 详情（右侧抽屉）──
const ktag = t => t ? `<span>${esc(t)}</span>` : '';
const coRow = r => `<div class="kit-row" data-kit-go="co/${encodeURIComponent(r.symbol)}">${logo(r)}<span class="kit-rt"><b>${esc(r.symbol)}</b> · ${esc(r.name)}</span>
  <span class="kit-rm">${md(r.date)} ${TIME_NAME[r.time] || ''} · ${fmtCap(r.mcap)}</span></div>`;
const evRow = e => `<div class="kit-row" data-kit-go="ev/${e.id}"><i class="imp ${e.impact}"></i><span class="kit-rt">${esc(e.title)}</span>
  <span class="kit-rm">${esc(COUNTRY_ZH[e.country] || e.country)} · ${bj(e.time).date} ${bj(e.time).time}</span></div>`;
const WHEN_NOTE = { bmo: '盘前发布：美股开盘前公布，约在北京时间当晚美股开盘前。', amc: '盘后发布：美股收盘后公布，约在北京时间次日清晨。', tbd: '公司尚未公布具体发布时段。' };

// 公司：id 为股票代码，同一代码有多条时取最近一次未发布的
KIT.item('co', id => {
  const rows = state.data.earnings.filter(r => r.symbol === id);
  if (!rows.length) return null;
  const r = rows.find(x => dayDiff(x.date) >= 0) || rows[rows.length - 1];
  const fc = epsNum(r.eps_fc), ly = epsNum(r.eps_ly);
  const yoy = fc != null && ly ? (fc - ly) / Math.abs(ly) * 100 : null;
  const peers = state.data.earnings.filter(x => x !== r && x.date === r.date && x.time === r.time).sort(byCap);
  const others = rows.filter(x => x !== r);
  return { title: r.name, sub: `${esc(r.symbol)} · 美东 ${md(r.date)} ${wd(r.date)} · ${TIME_NAME[r.time] || r.time}`,
    thumbIcon: logo(r), tags: [r.watch ? `<span style="background:var(--watch);color:#fff">⭐ 关注 · ${esc(r.watch)}</span>` : '', ktag(relDay(r.date)), ktag(r.fq && `财季 ${r.fq}`)],
    big: r.eps_fc ? `<b>${esc(r.eps_fc)}</b><span class="muted">EPS 预期</span>${r.eps_ly ? `<span class="muted">去年同期 ${esc(r.eps_ly)}</span>` : ''}${yoy != null ? `<span class="${yoy >= 0 ? 'ok' : 'bad'}">${yoy >= 0 ? '+' : ''}${yoy.toFixed(1)}%</span>` : ''}`
      : `<b>${fmtCap(r.mcap)}</b><span class="muted">市值</span>`,
    body: KIT.sec('关键数据', KIT.kv([['财报日（美东）', `${r.date} ${wd(r.date)}`], ['发布时段', TIME_NAME[r.time] || r.time], ['市值', r.mcap ? fmtCap(r.mcap) : ''],
        ['EPS 预期', r.eps_fc], ['去年同期 EPS', r.eps_ly], ['预期同比', yoy != null ? `${yoy >= 0 ? '+' : ''}${yoy.toFixed(1)}%` : ''],
        ['分析师数', r.ests && r.ests !== 'N/A' ? r.ests : ''], ['财季', r.fq], ['是否关注', r.watch ? `是（${r.watch}）` : '否']]))
      + KIT.sec('发布时间', KIT.p(WHEN_NOTE[r.time] || WHEN_NOTE.tbd))
      + KIT.sec(`同一天${TIME_NAME[r.time] || ''}发布的大公司`, peers.length ? `<div class="kit-rows">${peers.slice(0, 8).map(coRow).join('')}</div>` : '',
        `<a class="kit-morelink" href="#/list/day/${r.date}?time=${r.time}">全部 ${peers.length + 1} 家 →</a>`)
      + KIT.sec('其它财报日', others.length ? `<div class="kit-rows">${others.map(coRow).join('')}</div>` : ''),
    acts: [{ text: 'Nasdaq 财报页 ↗', href: `https://www.nasdaq.com/market-activity/stocks/${encodeURIComponent(r.symbol.toLowerCase())}/earnings` },
      { text: `当天全部财报`, href: `#/list/day/${r.date}`, self: true }] };
});

// 宏观事件：id 见 prepare()
KIT.item('ev', id => {
  const e = state.data.macro.find(x => x.id === id);
  if (!e) return null;
  const t = bj(e.time), cd = countdown(e.time), past = new Date(e.time) < Date.now();
  const sameDay = state.data.macro.filter(x => x !== e && x.date === e.date);
  const series = state.data.macro.filter(x => x !== e && x.kind === e.kind && (e.kind === 'fomc' || x.title_en === e.title_en || x.title.replace(/（.*）/, '') === e.title.replace(/（.*）/, '')));
  const vals = [e.forecast && `<span class="muted">预期</span> <b style="font-size:20px">${esc(e.forecast)}</b>`, e.previous && `<span class="muted">前值</span> <b style="font-size:20px">${esc(e.previous)}</b>`].filter(Boolean).join('&nbsp;&nbsp;');
  return { title: e.title, sub: `北京时间 ${t.date} ${t.time} · ${esc(COUNTRY_ZH[e.country] || e.country)} · ${KIND_NAME[e.kind] || e.kind}`,
    thumbIcon: { fomc: '🏛️', bea: '📊', week: '🗓️' }[e.kind] || '📅', thumbBg: `color-mix(in srgb, var(--${e.impact === 'High' ? 'high' : 'medium'}) 22%, transparent)`,
    tags: [`<span style="color:var(--${e.impact === 'High' ? 'high' : 'medium'})">${e.impact === 'High' ? '高影响' : '中影响'}</span>`, ktag(/点阵图/.test(e.title) ? '含点阵图' : ''), ktag(relDay(e.date))],
    big: `${past ? '<b>已发布</b>' : `<b>${cd.n}</b><span class="muted">${cd.u}后</span>`}${vals ? `&nbsp;&nbsp;${vals}` : ''}`,
    body: KIT.sec('事件信息', KIT.kv([['北京时间', `${t.date} ${t.time}`], ['美东日期', `${e.date} ${wd(e.date)}`], ['国家 / 地区', COUNTRY_ZH[e.country] || e.country],
        ['重要度', e.impact === 'High' ? '高' : '中'], ['预期值', e.forecast], ['前值', e.previous], ['数据来源', { fomc: '美联储官方日程', bea: 'BEA 官方日程', week: 'ForexFactory 周历' }[e.kind]]]))
      + (e.title_en && e.title_en !== e.title ? KIT.sec('英文名称', KIT.p(e.title_en)) : '')
      + KIT.sec('同一天的其它事件', sameDay.length ? `<div class="kit-rows">${sameDay.map(evRow).join('')}</div>` : '')
      + KIT.sec(e.kind === 'fomc' ? '其它 FOMC 日程' : '同一指标的其它日期', series.length ? `<div class="kit-rows">${series.slice(0, 8).map(evRow).join('')}</div>` : ''),
    acts: [{ text: `${{ fomc: '美联储日程', bea: 'BEA 发布日程', week: 'ForexFactory 周历' }[e.kind] || '来源'} ↗`, href: e.url }] };
});

// ── 列表页：#/list/day/<美东日期>?time=bmo|amc|tbd&cap=…&sort=… ──
const LPAGE = 30;
let listN = LPAGE;
const LCAPS = [['all', '全部'], ['watch', '只看关注'], ['1e11', '≥ 1000 亿'], ['1e10', '≥ 100 亿']];
const LSORTS = { cap: ['市值从高到低', byCap], ests: ['分析师数最多', (a, b) => (+b.ests || 0) - (+a.ests || 0) || byCap(a, b)],
  eps: ['EPS 预期最高', (a, b) => (epsNum(b.eps_fc) ?? -1e9) - (epsNum(a.eps_fc) ?? -1e9)], sym: ['代码 A–Z', (a, b) => a.symbol.localeCompare(b.symbol)] };
const dayHref = (d, q, over) => { const p = new URLSearchParams(q); Object.entries(over).forEach(([k, v]) => v === 'all' || v === 'cap' && k === 'sort' ? p.delete(k) : p.set(k, v)); const s = p.toString(); return `#/list/day/${d}${s ? '?' + s : ''}`; };
KIT.list('day', (d, q, box) => {
  const time = q.get('time') || 'all', cap = q.get('cap') || 'all', sort = LSORTS[q.get('sort')] ? q.get('sort') : 'cap';
  const all = state.data.earnings.filter(r => r.date === d && matchQ(r.symbol, r.name, r.watch));
  const capOk = r => cap === 'all' || (cap === 'watch' ? !!r.watch : !!r.watch || (r.mcap || 0) >= +cap);
  const inCap = all.filter(capOk);
  const list = inCap.filter(r => time === 'all' || r.time === time).sort(LSORTS[sort][1]);
  const dates = [...new Set(state.data.earnings.map(r => r.date))].sort();
  const i = Math.max(0, dates.indexOf(d));
  const near = dates.slice(Math.max(0, i - 3), i + 7);
  box.innerHTML = KIT.shell({ title: `${md(d)} ${wd(d)} 财报`, note: `${relDay(d)} · 共 ${all.length} 家 · 美东日期`,
    chips: [['all', '全部'], ['bmo', '盘前'], ['amc', '盘后'], ['tbd', '时间未定']].map(([k, n]) => ({ text: n, href: dayHref(d, q, { time: k }), on: k === time, count: inCap.filter(r => k === 'all' || r.time === k).length })),
    sort: Object.entries(LSORTS).map(([k, v]) => [k, v[0]]), sortVal: sort,
    body: `<div class="lp-days">${near.map(x => `<a class="${x === d ? 'on' : ''}" href="${dayHref(x, q, {})}">${md(x)} ${wd(x)}<small>${state.data.earnings.filter(r => r.date === x).length}</small></a>`).join('')}</div>
      <div class="kit-chips" style="margin-bottom:12px">${LCAPS.map(([k, n]) => `<a class="${k === cap ? 'on' : ''}" href="${dayHref(d, q, { cap: k })}">${n}<small>${all.filter(r => k === 'all' || (k === 'watch' ? !!r.watch : !!r.watch || (r.mcap || 0) >= +k)).length}</small></a>`).join('')}</div>
      ${list.length ? `<section class="card"><div class="table-wrap"><table>${erTable(list.slice(0, listN))}</table></div></section>` : '<div class="card empty">这一天没有符合条件的财报</div>'}`,
    more: list.length > listN ? `加载更多（${listN} / ${list.length}）` : '' });
});
document.addEventListener('click', e => { if (e.target.closest('[data-kit-more]')) { listN += LPAGE; render(); } });
document.addEventListener('change', e => {
  if (!e.target.matches('[data-kit-sort]')) return;
  const r = KIT.parse();
  if (r && r.kind === 'list') location.hash = dayHref(r.id, r.q, { sort: e.target.value });
});
window.addEventListener('hashchange', () => { if (KIT.parse()?.kind !== 'item') listN = LPAGE; }, true);

// ── 右侧挂件 ──
function renderWidgets() {
  const watch = state.data.earnings.filter(r => r.watch && dayDiff(r.date) >= 0);
  $('#w-watch').innerHTML = watch.map(r => `
    <div class="w-row" data-kit-item="co/${encodeURIComponent(r.symbol)}">${symTag(r)}<span class="nm">${esc(r.name)}</span>${tmTag(r.time)}<small>${md(r.date)} · ${relDay(r.date)}</small></div>`).join('')
    || '<div class="w-row"><small>未来两周没有关注公司发财报</small></div>';
  const fomc = state.data.macro.filter(e => e.kind === 'fomc' && new Date(e.time) > Date.now()).slice(0, 4);
  $('#w-fomc').innerHTML = fomc.map(e => {
    const t = bj(e.time), cd = countdown(e.time);
    return `<div class="w-row" data-kit-item="ev/${e.id}"><span class="nm">${t.date} ${t.time}${/点阵图/.test(e.title) ? ' <span class="tag">点阵图</span>' : ''}</span><small>${cd.n} ${cd.u}后</small></div>`;
  }).join('') || '<div class="w-row"><small>暂无</small></div>';
  const { sources } = state.data;
  $('#w-ok').textContent = `${sources.filter(s => s.ok).length}/${sources.length} 正常`;
  $('#w-status').innerHTML = sources.map(s => `
    <div class="status-row" title="${esc(s.error)}">${esc(s.name)}
      <span class="t">${s.ok ? `<span class="ok">●</span> ${s.count} 条` : `<span class="${s.updated ? 'warn' : 'bad'}">●</span> ${s.updated ? '旧数据' : '失败'}`}</span></div>`).join('');
}

// ── 渲染入口 ──
function render() {
  if (!state.data) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === state.view));
  renderNav();
  renderWidgets();
  const isList = KIT.route($('#content'));               // #/list/… 列表页渲染进正文
  $('.main-head').style.display = isList ? 'none' : '';
  if (!isList) $('#content').innerHTML = { week: renderWeek, earnings: renderEarnings, macro: renderMacro }[state.view]();
  const upE = state.data.earnings.filter(r => dayDiff(r.date) >= 0 && dayDiff(r.date) < 7);
  const upM = state.data.macro.filter(e => e.country === 'USD' && dayDiff(e.date) >= 0 && dayDiff(e.date) < 7);
  $('#subtitle').textContent = `未来 7 天：${upE.length} 家公司发财报（${upE.filter(r => r.watch).length} 家在关注列表）· ${upM.length} 个美国宏观事件`;
  $('#updated').textContent = `更新于 ${new Date(state.data.updated).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}`;
}

async function load(isRefresh) {
  const btn = $('#reload');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('spin');
  try {
    const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const first = !state.data;
    state.data = prepare(await res.json());
    render();
    if (first) KIT.boot();                               // 直接打开 #/item/… 的链接
    btn.title = '重新加载数据';
  } catch (e) {
    // 刷新失败保留已有内容，只有首次加载失败才替换为报错
    if (!isRefresh || !state.data) {
      $('#content').innerHTML = `<div class="empty">数据加载失败：${esc(e.message)}<br><small>本地预览需通过 HTTP 服务打开（python3 -m http.server）</small></div>`;
    }
    btn.title = '刷新失败，请稍后重试';
  } finally {
    btn.disabled = false;
    btn.classList.remove('spin');
  }
}

// ── 事件绑定 ──
document.addEventListener('click', e => {
  const t = e.target.closest('[data-cap],[data-country],[data-view],[data-past]');
  if (!t || !state.data) return;
  if (t.dataset.cap) { state.cap = t.dataset.cap === 'watch' ? 'watch' : +t.dataset.cap; store.set('cap', state.cap); }
  else if (t.dataset.country) { state.country = t.dataset.country; store.set('country', state.country); }
  else if (t.dataset.view && KIT.parse()) { state.view = t.dataset.view; store.set('view', state.view); state.showPast = false; location.hash = state.view; return; }   // 列表页上点标签：回首页对应视图
  else if (t.dataset.view) { state.view = t.dataset.view; store.set('view', state.view); history.replaceState(null, '', '#' + state.view); state.showPast = false; }
  else if (t.dataset.past) { state.showPast = !state.showPast; }
  render();
});

let timer;
$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value.trim(); if (state.data) render(); }, 150);
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; state.q = ''; if (state.data) render(); $('#q').blur(); }
});
if (!/Mac/.test(navigator.platform)) $('#kbd').textContent = 'Ctrl K';
$('#reload').onclick = () => load(true);

KIT.init(render);
load(false);
setInterval(() => load(true), 10 * 60 * 1000);  // 每 10 分钟自动重新读取；倒计时也随之刷新
</script>
</body>
</html>
